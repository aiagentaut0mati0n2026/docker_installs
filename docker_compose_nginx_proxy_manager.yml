---
# Nginx Proxy Manager - reverse proxy with web UI and automatic SSL
# Port 80: HTTP / Let's Encrypt challenge
# Port 81: Admin UI - restrict to LAN/VPN only
# Port 443: HTTPS public traffic
services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    environment:
      DISABLE_IPV6: "true"
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  default:
    name: my-main-net
    external: true
