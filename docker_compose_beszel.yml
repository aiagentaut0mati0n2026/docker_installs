---
# Beszel - lightweight system monitoring hub with web dashboard
# Port 8090: web UI - put behind Nginx Proxy Manager with SSL
# extra_hosts allows Beszel to monitor the host machine without host networking mode
services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8090:8090"
    volumes:
      - ./beszel_data:/beszel_data
    environment:
      TZ: "UTC"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  default:
    name: my-main-net
    external: true
