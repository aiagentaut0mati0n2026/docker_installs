---
# Apache Guacamole - clientless remote desktop gateway (RDP/SSH/VNC in browser)
# Port 8080: web UI - put behind Nginx Proxy Manager with SSL and WebSocket support
# Default credentials: guacadmin / guacadmin - CHANGE IMMEDIATELY after first login
# NPM settings: WebSocket Support YES, Force SSL YES, HTTP/2 YES
services:
  guacamole:
    image: jwetzell/guacamole:latest
    container_name: guacamole
    restart: unless-stopped
    volumes:
      - ./guac_config:/config
    ports:
      - "8080:8080"
    environment:
      TZ: "UTC"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/guacamole/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  default:
    name: my-main-net
    external: true
