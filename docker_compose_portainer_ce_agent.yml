---
# Portainer Agent - connects a remote Docker host to a Portainer CE instance
# Port 9001: agent communication - restrict to your Portainer CE server IP only
services:
  portainer-agent:
    image: portainer/agent:latest
    container_name: portainer_agent
    restart: unless-stopped
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
    environment:
      # AGENT_SECRET: "your-strong-secret-here"
      LOG_LEVEL: WARN
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  default:
    name: my-main-net
    external: true
