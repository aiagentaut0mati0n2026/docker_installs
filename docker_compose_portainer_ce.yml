---
# Portainer CE - Docker management web UI
# Port 9443: HTTPS web UI (preferred)
# Port 9000: HTTP web UI (legacy)
# Port 8000: Edge Agent tunnel
# Security: put behind Nginx Proxy Manager - do NOT expose to internet directly
services:
  portainer-ce:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./portainer_data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  default:
    name: my-main-net
    external: true
